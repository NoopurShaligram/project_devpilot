[project]
name = "forge-ai-advisor"
version = "0.2.0"
description = "Phase 2: agentic AI-assisted software engineering workflow orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "langgraph>=1.2.12",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langgraph-checkpoint-sqlite>=3.1",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.28"]

[project.scripts]
forge = "forge_advisor.cli.main:main"
